name: CI
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    name: Validate JsonEngine (restore, build and test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify Docker runtime
        run: docker info
      - name: Restore solution
        run: dotnet restore KUKULCAN.SharedKernel.JsonEngine.slnx
      - name: Build solution
        run: dotnet build KUKULCAN.SharedKernel.JsonEngine.slnx --no-restore --configuration Release
      - name: Run unit tests
        run: dotnet test Tests/KUKULCAN.SharedKernel.JsonEngine.UnitTests/KUKULCAN.SharedKernel.JsonEngine.UnitTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"
      - name: Run JsonEngine integration tests
        run: dotnet test Tests/KUKULCAN.SharedKernel.JsonEngine.Integration/KUKULCAN.SharedKernel.JsonEngine.Integration.csproj --no-build --configuration Release --logger "console;verbosity=normal"
