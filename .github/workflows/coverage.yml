name: Code Coverage
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    name: Measure and publish JsonEngine code coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify Docker runtime
        run: docker info
      - name: Create coverage settings
        shell: bash
        run: |
          cat > /tmp/jsonengine-coverage.runsettings <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RunSettings>
            <DataCollectionRunSettings>
              <DataCollectors>
                <DataCollector friendlyName="XPlat Code Coverage">
                  <Configuration>
                    <Format>cobertura</Format>
                    <Include>[KUKULCAN.SharedKernel.JsonEngine]*</Include>
                    <Exclude>[KUKULCAN.SharedKernel.JsonEngine.UnitTests]*</Exclude>
                    <Exclude>[KUKULCAN.SharedKernel.JsonEngine.Integration]*</Exclude>
                    <ExcludeByAttribute>CompilerGeneratedAttribute</ExcludeByAttribute>
                    <SingleHit>false</SingleHit>
                    <UseSourceLink>true</UseSourceLink>
                    <SkipAutoProps>true</SkipAutoProps>
                  </Configuration>
                </DataCollector>
              </DataCollectors>
            </DataCollectionRunSettings>
          </RunSettings>
          EOF
      - name: Prepare solution for coverage
        run: dotnet restore KUKULCAN.SharedKernel.JsonEngine.slnx
      - name: Build solution for coverage
        run: dotnet build KUKULCAN.SharedKernel.JsonEngine.slnx --no-restore --configuration Release
      - name: Run unit tests with coverage
        run: >-
          dotnet test Tests/KUKULCAN.SharedKernel.JsonEngine.UnitTests/KUKULCAN.SharedKernel.JsonEngine.UnitTests.csproj
          --no-build --configuration Release --settings /tmp/jsonengine-coverage.runsettings
          --logger "console;verbosity=normal" --collect:"XPlat Code Coverage"
      - name: Run JsonEngine integration tests with coverage
        run: >-
          dotnet test Tests/KUKULCAN.SharedKernel.JsonEngine.Integration/KUKULCAN.SharedKernel.JsonEngine.Integration.csproj
          --no-build --configuration Release --settings /tmp/jsonengine-coverage.runsettings
          --logger "console;verbosity=normal" --collect:"XPlat Code Coverage"
      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: kukulcan-sharedkernel-jsonengine-unit-coverage
          path: Tests/KUKULCAN.SharedKernel.JsonEngine.UnitTests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
      - name: Upload JsonEngine Integration coverage
        uses: actions/upload-artifact@v4
        with:
          name: kukulcan-sharedkernel-jsonengine-integration-coverage
          path: Tests/KUKULCAN.SharedKernel.JsonEngine.Integration/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
